name: Sunrise Dental Clinic CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Check Java version
        run: java -version

      - name: Check project structure
        run: |
          echo "Checking Sunrise Dental Clinic project..."
          test -d src
          test -d src/main
          test -d src/main/java
          test -d src/main/webapp
          echo "Project structure OK"

      - name: Check Java source files
        run: |
          echo "Java source files:"
          find src/main/java -name "*.java"
          echo "Source files found successfully"

      - name: CI build check
        run: |
          echo "Sunrise Dental Clinic CI build check completed successfully."
